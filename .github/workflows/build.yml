name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk is250-obd.apk
          gh release create "build-${GITHUB_RUN_NUMBER}" is250-obd.apk \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --latest
